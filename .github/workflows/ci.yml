name: CI

# Both gates, on every branch that ships a build. The rebuild's whole safety
# argument is that the golden models and the suites do not move, and more than once
# a change looked fine to read and moved one of them. This makes that check happen
# without anyone remembering to run it.

on:
  push:
    branches: [main, rebuild, wii-skin]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Tests
        run: npm test

      - name: Golden models
        run: npm run golden

      - name: Build the userscript
        run: npm run userscript

      # The version in the header is injected from package.json, so this checks
      # the injection happened rather than that someone typed the right number.
      - name: The artifact carries the package version
        run: |
          version=$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' package.json | head -1)
          echo "package version: $version"
          grep -q "^// @version      $version$" ../studio-director-rebuilt.user.js

      # A committed artifact that no longer matches the source is how the stale
      # 0.2.0 survived. If this fails, run `npm run userscript` and commit it.
      - name: The committed artifact is current
        run: git diff --exit-code -- ../studio-director-rebuilt.user.js

  # main is wii-skin minus the skin: one tree, with the Wii skin taken out, kept true
  # by `npm run sync:main`. This fails on a commit that the strip does not produce - a
  # half-applied sync, a skin file left behind, or a skin edit the strip has not
  # learned yet. If it fails, run the sync rather than editing main by hand, which is
  # how the two lines drifted apart in the first place.
  main-minus-skin:
    # Only main is defined as the stripped tree; the other lines have nothing to be
    # compared against.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the line this one is defined against
        run: git fetch --depth=1 origin +refs/heads/wii-skin:refs/remotes/origin/wii-skin

      - name: main is wii-skin minus the skin
        run: node web/tools/main-from-skin.mjs --check --in . --from origin/wii-skin
